plugins {
    // one Loom for every version: the remapping plugin for the obfuscated versions (1.21.11 and older: the official
    // Mojang names are remapped to intermediary for the jar), the plain one for the unobfuscated 26.x (the jar keeps
    // the official names, intermediary 0.0.0)
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    version = "${project.mod_version}+${project.name}"
    group = project.maven_group

    // the shared code (the payload, the gate, the commands and the mixins) and the version's own, if any
    plugins.withId('java') {
        sourceSets.main.java.srcDirs = [rootProject.file('common/src/main/java'), 'src/main/java']
        sourceSets.main.resources.srcDirs = [rootProject.file('common/src/main/resources'), 'src/main/resources']

        base {
            archivesName = project.archives_base_name
        }

        processResources {
            def props = [version: project.version, minecraft: project.name, java: project.java_version]
            inputs.properties props
            filesMatching('fabric.mod.json') {
                expand props
            }
        }

        java {
            sourceCompatibility = JavaVersion.toVersion(project.java_version)
            targetCompatibility = JavaVersion.toVersion(project.java_version)
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = project.java_version as int
            it.options.encoding = 'UTF-8'
        }
    }
}
