pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'lockstep'

// one subproject per Minecraft version (versions/<version>), all built from the shared sources in common/
new File(rootDir, 'versions').listFiles().findAll { new File(it, 'build.gradle').exists() }.sort().each {
    include ":${it.name}"
    project(":${it.name}").projectDir = it
}
